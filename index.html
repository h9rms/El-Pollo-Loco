<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/standard.css" />
        <link rel="stylesheet" href="style.css" />
        <title>El Pollo Loco</title>
    </head>
    <body>
        <div id="rotate-overlay">
            <p>Please rotate your device to landscape mode to play.</p>
        </div>

        <h1 id="page-title">El Pollo Loco</h1>

        <div id="game-wrapper">
            <button id="muteBtn" class="mute-btn">&#128266;</button>

            <div id="start-screen">
                <div class="start-buttons">
                    <button id="startBtn">Start Game</button>
                    <button id="controlsBtn">Show Controls</button>
                </div>
            </div>

            <canvas id="canvas" width="720" height="480" style="display:none;"></canvas>

            <div id="end-screen" style="display:none;">
                <div class="start-buttons">
                    <button id="restartBtn">Restart</button>
                    <button id="homeBtn">Back to Start</button>
                </div>
            </div>

            <div id="mobile-controls">
                <div class="mobile-controls-left">
                    <button id="btnLeft" class="control-btn">&#8592;</button>
                    <button id="btnRight" class="control-btn">&#8594;</button>
                </div>
                <div class="mobile-controls-right">
                    <button id="btnJump" class="control-btn">&#8593;</button>
                    <button id="btnThrow" class="control-btn">F</button>
                </div>
            </div>
        </div>

        <dialog id="controls-dialog">
            <button id="closeControlsBtn" class="dialog-close">&times;</button>
            <h2>Controls</h2>
            <ul>
                <li>&larr; / &rarr; &ndash; Move</li>
                <li>Spacebar &ndash; Jump</li>
                <li>F &ndash; Throw Bottle</li>
            </ul>
        </dialog>

        <script type="module" src="./js/game.js"></script>
    </body>
</html>
