<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>El Pollo Loco</title>
    </head>
    <body>
        <div id="game-wrapper">
            <button id="muteBtn" class="mute-btn">&#128266;</button>

            <div id="start-screen">
                <h1>El Pollo Loco</h1>
                <div class="start-buttons">
                    <button id="startBtn">Spiel starten</button>
                    <button id="controlsBtn">Steuerung anzeigen</button>
                </div>
            </div>

            <canvas id="canvas" width="720" height="480" style="display:none;"></canvas>

            <div id="end-screen" style="display:none;">
                <h1 id="end-screen-title"></h1>
                <div class="start-buttons">
                    <button id="restartBtn">Neustart</button>
                    <button id="homeBtn">Zurück zum Start</button>
                </div>
            </div>
        </div>

        <dialog id="controls-dialog">
            <button id="closeControlsBtn" class="dialog-close">&times;</button>
            <h2>Steuerung</h2>
            <ul>
                <li>&larr; / &rarr; &ndash; Laufen</li>
                <li>Leertaste &ndash; Springen</li>
                <li>F &ndash; Flasche werfen</li>
            </ul>
        </dialog>

        <script type="module" src="./js/game.js"></script>
    </body>
</html>
